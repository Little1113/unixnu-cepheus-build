name: cepheus-touch-power-cycle
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      MACOS_VERSION: "13.5"
      MACHINE_CONFIG: SWEET
      KERNEL_CONFIG: DEVELOPMENT
      DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration
      - uses: actions/checkout@v4
        with:
          repository: YangQi0408/UniXNU-cepheus
          ref: b84dc6da2fd7cd080ca1f41836c25a84363cd8ff
          path: cepheus
      - name: Apply bounded touch diagnostics
        run: |
          git -C cepheus apply --check ../integration/touch-diagnostics.patch
          git -C cepheus apply ../integration/touch-diagnostics.patch
          cp integration/cepheus_touch_diag.h integration/test_touch_diag.c cepheus/xnu/
          git -C cepheus apply --check ../integration/touch-resume.patch
          git -C cepheus apply ../integration/touch-resume.patch
          cp integration/cepheus_fts_resume.h integration/test_fts_resume.c cepheus/xnu/
          git -C cepheus apply --check ../integration/touch-sensor-info.patch
          git -C cepheus apply ../integration/touch-sensor-info.patch
          cp integration/cepheus_fts_info.h integration/test_fts_info.c cepheus/xnu/
          git -C cepheus apply --check ../integration/touch-powercycle.patch
          git -C cepheus apply ../integration/touch-powercycle.patch
          cp integration/cepheus_fts_powercycle.h integration/test_fts_powercycle.c cepheus/xnu/
      - uses: actions/checkout@v4
        with:
          repository: dipa-studio/ios-sweet
          ref: 45263bee51df4a0f55cdf9c649af886399488ddb
          path: ios-sweet
      - name: Stage pinned sources and cepheus driver
        run: |
          set -euo pipefail
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          bash cepheus/scripts/build-kernel-patches.sh ios-sweet
          cp ios-sweet/xnu/patches/*.patch ios-sweet/xnu/patches/*.sh dxb/patches/
          cp cepheus/xnu/cepheus_touch.c cepheus/xnu/cepheus_fts_events.h cepheus/xnu/cepheus_clock_status.h cepheus/xnu/cepheus_gpi_layout.h dxb/patches/
          cp cepheus/xnu/cepheus_i2c_bitbang.h dxb/patches/
          cp cepheus/xnu/cepheus_touch_diag.h dxb/patches/
          cp cepheus/xnu/cepheus_fts_resume.h dxb/patches/
          cp cepheus/xnu/cepheus_fts_info.h dxb/patches/
          cp cepheus/xnu/cepheus_fts_powercycle.h dxb/patches/
          # Retain the verified one-shot Home, PON-only keys and fast blank.
          python3 cepheus/scripts/prepare-performance-patch.py ios-sweet/xnu/patches dxb/patches/0083-cepheus-performance.patch
          python3 cepheus/scripts/test-performance.py
          python3 cepheus/scripts/prepare-touch-power-patch.py ios-sweet/xnu/patches dxb/patches/0084-cepheus-touch-power.patch
          python3 cepheus/scripts/test-touch-power.py ios-sweet/xnu/patches
          python3 integration/prepare-touch-resume.py ios-sweet/xnu/patches dxb/patches/0083-cepheus-performance.patch dxb/patches/0085-cepheus-touch-resume.patch
          python3 integration/prepare-inherited-state.py ios-sweet/xnu/patches dxb/patches/0084-cepheus-touch-power.patch dxb/patches/0086-cepheus-inherited-power.patch
          python3 integration/prepare-power-cycle.py ios-sweet/xnu/patches dxb/patches/0084-cepheus-touch-power.patch dxb/patches/0086-cepheus-inherited-power.patch dxb/patches/0087-cepheus-power-cycle.patch
          # The SWEET kernel is plain arm64, not arm64e.
          python3 -c 'from pathlib import Path; p=Path("dxb/build.sh"); s=p.read_text(); old="ARCHS=\"x86_64 arm64e\" VALID_ARCHS=\"x86_64 arm64e\""; assert s.count(old)==1; p.write_text(s.replace(old,"ARCHS=\"x86_64 arm64e arm64\" VALID_ARCHS=\"x86_64 arm64e arm64\""))'
      - name: Toolchain and event parser regression
        run: |
          set -euo pipefail
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          test -d /Applications/Xcode_16.2.app
          echo "DEVELOPER_DIR=/Applications/Xcode_16.2.app/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
          xcrun --find iig
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_fts_events.c -o /tmp/fts-test
          /tmp/fts-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_i2c_bitbang.c -o /tmp/i2c-test
          /tmp/i2c-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_touch_diag.c -o /tmp/touch-diag-test
          /tmp/touch-diag-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_fts_resume.c -o /tmp/fts-resume-test
          /tmp/fts-resume-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_fts_info.c -o /tmp/fts-info-test
          /tmp/fts-info-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined cepheus/xnu/test_fts_powercycle.c -o /tmp/fts-powercycle-test
          /tmp/fts-powercycle-test
      - name: Build XNU
        working-directory: dxb
        run: |
          set -euo pipefail
          bash build.sh 2>&1 | tee build.log
      - name: Fail if required patches or cepheus source were skipped
        run: |
          set -euo pipefail
          grep -F 'Applying patch:' dxb/build.log | grep -F '0082-cepheus-touch.patch'
          if grep 'Skipping patch' dxb/build.log | grep -E '(0003-|0018-|0028-|0038-|0046-|0058-|0064-|0065-|0067-|0075-|0077-|0078-|0079-|0082-|0083-|0084-|0085-|0086-|0087-)'; then
            echo 'critical patch skipped' >&2; exit 1
          fi
          grep -E '^bsd/dev/cepheus_touch.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          ! grep -E '^bsd/dev/sweet_touch.c[[:space:]]+standard$' dxb/xnu/bsd/conf/files
          cmp cepheus/xnu/cepheus_touch.c dxb/xnu/bsd/dev/cepheus_touch.c
          cmp cepheus/xnu/cepheus_fts_events.h dxb/xnu/bsd/dev/cepheus_fts_events.h
          cmp cepheus/xnu/cepheus_clock_status.h dxb/xnu/bsd/dev/cepheus_clock_status.h
          cmp cepheus/xnu/cepheus_gpi_layout.h dxb/xnu/bsd/dev/cepheus_gpi_layout.h
          cmp cepheus/xnu/cepheus_i2c_bitbang.h dxb/xnu/bsd/dev/cepheus_i2c_bitbang.h
          cmp cepheus/xnu/cepheus_touch_diag.h dxb/xnu/bsd/dev/cepheus_touch_diag.h
          cmp cepheus/xnu/cepheus_fts_resume.h dxb/xnu/bsd/dev/cepheus_fts_resume.h
          cmp cepheus/xnu/cepheus_fts_info.h dxb/xnu/bsd/dev/cepheus_fts_info.h
          cmp cepheus/xnu/cepheus_fts_powercycle.h dxb/xnu/bsd/dev/cepheus_fts_powercycle.h
          grep 'Applying patch:' dxb/build.log | grep 0087-cepheus-power-cycle.patch
          grep 'Applying patch:' dxb/build.log | grep 0086-cepheus-inherited-power.patch
          grep 'Applying patch:' dxb/build.log | grep 0085-cepheus-touch-resume.patch
          grep -F 'cepheus_touch_display_power(off ? 0 : 1);' dxb/xnu/iokit/Kernel/arm/SweetFramebuffer.cpp
          mkdir out
          K=dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          python3 cepheus/scripts/verify-touch-kernel.py "$K"
          python3 -c 'from pathlib import Path;d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes();assert all(s in d for s in (b"CEPHEUS TOUCH RAW:",b"CEPHEUS TOUCH POLL:",b"CEPHEUS TOUCH EXIT:",b"sweettouchdiag"))'
          python3 -c 'from pathlib import Path;d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes();assert all(s in d for s in (b"CEPHEUS TOUCH POWER:",b"CEPHEUS TOUCH RESUME EVENT:",b"sweettouchresume"))'
          python3 -c 'from pathlib import Path;d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes();assert all(s in d for s in (b"CEPHEUS SYSINFO:",b"CEPHEUS SENSOR:",b"CEPHEUS TCS LDOC1:",b"sweettouchinfo"))'
          python3 -c 'from pathlib import Path;d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes();assert all(s in d for s in (b"CEPHEUS CYCLE:",b"sweettouchcycle",b"ldoc1 set=%d request result=%d"))'
          grep 'Applying patch:' dxb/build.log | grep 0084-cepheus-touch-power.patch
          python3 -c 'from pathlib import Path;d=Path("dxb/fakeroot/System/Library/Kernels/kernel.development.sweet").read_bytes();assert all(s in d for s in (b"SWEET BLANK:",b"one-shot Home complete",b"SWEET GPI: SMMU"))'
          cp "$K" out/kernel.macho
          (cd out && shasum -a 256 kernel.macho > SHA256SUMS)
          git -C cepheus rev-parse HEAD > out/device-commit.txt
          git -C ios-sweet rev-parse HEAD > out/ios-sweet-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cepheus-touch-kernel
          retention-days: 1
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cepheus-touch-build-log
          retention-days: 1
          path: dxb/build.log
          if-no-files-found: ignore
